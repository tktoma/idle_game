# Version 0.172 : Gradle construit et teste les modules en même temps. Les tâches de test de core, ui et bots sont
# indépendantes : chacune tourne sur ses propres JVM, et « tout tester » dure le temps du module le plus long (les bots),
# pas la somme des trois. Le cache de construction garde les résultats d'un module dont rien n'a changé (./gradlew test
# les réutilise ; ./gradlew toutTester rejoue toujours tout).
org.gradle.parallel=true
org.gradle.caching=true
