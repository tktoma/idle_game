# Version 0.172 : les tests des bots peuvent se jouer en même temps, un par cœur, quand leur méthode le demande
# (@Execution(CONCURRENT) : les campagnes des 24 profils, un test par profil). Par défaut, tout reste dans un seul fil,
# et deux classes ne se mêlent jamais : la campagne attend la fin de ses parties avant que la classe suivante ne
# commence (l'annotation est sur les méthodes ; sur une classe, elle la ferait courir en même temps que les autres).
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
