name: Audit 24 bots depuis zero

on:
  # Ne pas alourdir les tests ordinaires. Demarre sur master quand cette campagne
  # change, puis reste relancable manuellement (version 0.126 : avant, la branche
  # visee, ...-20261021, n'etait pas celle qui a ete fusionnee).
  push:
    branches:
      - master
    paths:
      - .github/workflows/fresh-universe-audit.yml
      - idle/bots/src/main/java/FreshUniverseAudit.java
  workflow_dispatch:
    inputs:
      horizon_hours:
        description: "Plafond de securite en heures simulees par bot, pour tout l'essai quel que soit le nombre d'univers vises (absence de victoire = LIMIT ; echec seulement en mode strict)"
        required: true
        default: "168"
      strict:
        description: "true : chaque profil doit former son univers ; false : seuls les blocages et erreurs font echouer"
        required: true
        default: "false"
      univers:
        description: "Univers a former : 1 (le premier, comme avant) a 11 (version 0.152). Les univers 2 et 3 se lancent des l'univers forme ; a partir du 4e, le bot arrose la graine jusqu'a son palier et joue l'arbre (bulles, hadrons). L'horizon reste global : 168 h suffisent aux trois univers des profils rapides, pas aux lents ni a onze univers (LIMIT, pas un echec hors mode strict)"
        required: true
        default: "1"

concurrency:
  group: fresh-universe-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Bots depuis zero ${{ matrix.first }}-${{ matrix.last }}
    runs-on: ubuntu-latest
    # 300 min pour le premier univers (trois profils de 168 h par runner tiennent sous 5 h) ; 360 min, le plus long
    # qu'accepte un runner GitHub, pour les univers 2 et 3 (meme horizon global, mais des parties plus longues a jouer).
    timeout-minutes: ${{ inputs.univers != '' && inputs.univers != '1' && 360 || 300 }}
    strategy:
      fail-fast: false
      # Trois profils par runner : les segments de six depassaient 5 h en CI.
      # Pas de fail-fast : meme si un profil echoue, tous les groupes livrent un rapport.
      matrix:
        include:
          - first: 1
            last: 3
          - first: 4
            last: 6
          - first: 7
            last: 9
          - first: 10
            last: 12
          - first: 13
            last: 15
          - first: 16
            last: 18
          - first: 19
            last: 21
          - first: 22
            last: 24
    defaults:
      run:
        working-directory: idle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Jouer jusqu'a l'univers ou diagnostic, depuis une partie neuve
        run: >-
          sh ./gradlew :bots:bot --no-daemon
          -Pclasse=FreshUniverseAudit
          --args="${{ matrix.first }} ${{ matrix.last }} ${{ inputs.horizon_hours || '168' }} 60 sorties/audit-depuis-zero ${{ inputs.strict || 'false' }} ${{ inputs.univers || '1' }}"
      - name: Conserver le bilan, les sauvegardes et les diagnostics meme si des bots echouent
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-depuis-zero-${{ matrix.first }}-${{ matrix.last }}
          path: idle/bots/sorties/audit-depuis-zero
          if-no-files-found: warn
          retention-days: 30
