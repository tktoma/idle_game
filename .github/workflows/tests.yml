# Lance les tests du jeu à chaque envoi sur GitHub.
#
# Ce fichier va à la RACINE du dépôt : .github/workflows/tests.yml (à côté du dossier idle/, pas dedans).
# Le résultat se lit dans l'onglet « Actions » du dépôt : une coche verte si tout passe, une croix rouge sinon.

name: Tests

# Toujours valider chaque commit, y compris ceux pousses par les outils GitHub, sauf ceux qui ne
# touchent qu'a la documentation (fichiers .md) : ils ne changent rien au code teste.
on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  # Lancement manuel de secours si GitHub ne declenche pas les jobs apres un commit API.
  workflow_dispatch:

# Les groupes de concurrence sont poses job par job : le job general ne garde que les tests du
# dernier commit de la branche ; la campagne des profils (quatre runners, jusqu'a 3 h chacun) finit
# toujours, sinon une branche active ne livrait presque jamais ses resultats.

jobs:
  tests:
    runs-on: ubuntu-latest
    # Sur une meme branche ou PR, ne conserver que les tests du dernier commit.
    concurrency:
      group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: idle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # « sh » : gradlew n'est pas marqué exécutable dans le dépôt.
      # « toutTester » lance les tests de tous les modules, ceux d'aujourd'hui et ceux à venir ; il compile
      # aussi l'interface et l'application : une erreur de compilation fait échouer l'envoi.
      - name: Préparer l'affichage virtuel des tests JavaFX
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Tous les tests, et la compilation de l'interface
        run: xvfb-run -a sh ./gradlew toutTester --continue --no-daemon -PciWithoutProfiles=true

      - name: Garder le rapport quand un test échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-des-tests
          path: idle/*/build/reports/tests/test

  # Les 24 profils sont TOUS joués avec leur durée complète, graine inchangée,
  # sans état Java partagé. Chaque segment vérifie la couverture exacte des IDs.
  # Les autres tests (dont expert et UI) tournent dans le job général ci-dessus.
  profiles:
    name: Campagne bots profils ${{ matrix.first }}-${{ matrix.last }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Son propre groupe, sans annulation : une campagne commencee va au bout, la suivante attend son tour.
    concurrency:
      group: profils-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ matrix.first }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - first: 1
            last: 6
          - first: 7
            last: 12
          - first: 13
            last: 18
          - first: 19
            last: 24
    defaults:
      run:
        working-directory: idle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Tous les profils du segment (2 h neuves + 16 h avancees + diagnostiques 24 h)
        run: >-
          sh ./gradlew :bots:test --continue --no-daemon
          --tests Profiles24CampaignTest --tests Profiles24LongCampaignTest
          -PciProfilesStart=${{ matrix.first }} -PciProfilesEnd=${{ matrix.last }}

      - name: Garder le rapport si un profil echoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-profils-${{ matrix.first }}-${{ matrix.last }}
          path: idle/bots/build/reports/tests/test

  # Version 0.152 : le Speedrunner (profil 1, graine 201, pas de 20 s) joue une partie neuve jusqu'a onze univers
  # formes (graine, bulles de l'arbre, hadrons). A part, comme la campagne des profils : de l'ordre d'une heure.
  onze-univers:
    name: Speedrunner jusqu'a onze univers
    runs-on: ubuntu-latest
    timeout-minutes: 240
    concurrency:
      group: onze-univers-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: idle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Onze univers depuis zero
        run: >-
          sh ./gradlew :bots:test --continue --no-daemon
          --tests ElevenUniversesLongTest -PonzeUnivers=true

      - name: Garder le rapport si la partie echoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-onze-univers
          path: idle/bots/build/reports/tests/test
