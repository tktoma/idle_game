# Lance les tests du jeu à chaque envoi sur GitHub.
#
# Ce fichier va à la RACINE du dépôt : .github/workflows/tests.yml (à côté du dossier idle/, pas dedans).
# Le résultat se lit dans l'onglet « Actions » du dépôt : une coche verte si tout passe, une croix rouge sinon.

name: Tests

# Eviter deux campagnes lourdes simultanees pour le meme commit.
# Une branche de fonctionnalite est testee via pull_request ; master via push.
on:
  push:
    branches:
      - master
  pull_request:

# Sur une meme PR, ne conserver que les tests du dernier commit.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # « sh » : gradlew n'est pas marqué exécutable dans le dépôt.
      # « toutTester » lance les tests de tous les modules, ceux d'aujourd'hui et ceux à venir ; il compile
      # aussi l'interface et l'application : une erreur de compilation fait échouer l'envoi.
      - name: Préparer l'affichage virtuel des tests JavaFX
        run: sudo apt-get update -qq && sudo apt-get install -y xvfb

      - name: Tous les tests, et la compilation de l'interface
        run: xvfb-run -a sh ./gradlew toutTester --continue --no-daemon

      - name: Garder le rapport quand un test échoue
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-des-tests
          path: idle/*/build/reports/tests/test
